data:
  network_path: "data/multi_tank"
  demands_path: "data/multi_tank/demands2022.csv"
  tariffs_path: "data/multi_tank/tariffs2022.csv"

columns:
  prices_col: "tariff"
  demand_cols: ["a", "b", "c"]

training:
  forecast:
    start: "2022-01-01"
    end: "2022-09-30"
  uncertainty:
    start: "2022-08-01"
    end: "2022-09-30"

forecast:
  model: "naive"
  holiday_country: "HU"
  params:
    n_weeks: 4

experiment:
  name: "mpc_october"
  type: "mpc_sweep"

  experiment_period:
    start: "2022-10-01 00:00"
    horizon: 168

  mpc:
    step_horizon: 24  # lookahead window (hours)
    wait: 1           # hours between re-optimizations (implemented steps)

  methods:
    - group: "LP"
      opt_method: "lp"

    - group: "RO-Ellipsoid"
      opt_method: "ro"
      params:
        uncertainty_set: "ellipsoid"
      sweep:
        omega: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]

    - group: "CC-SP"
      opt_method: "sp"
      sweep:
        alpha: [[0.80, 0.8], [0.85, 0.85], [0.90, 0.9], [0.95, 0.95], [0.99, 0.99], [0.995, 0.995]]

    - group: "CC-SP-relaxed"
      opt_method: "sp"
      sweep:
        alpha: [ [ 0.80, 0.75 ], [ 0.85, 0.8 ], [ 0.90, 0.85 ], [ 0.95, 0.9 ], [ 0.99, 0.94 ], [ 0.995, 0.945 ] ]

  group_styles:
    RO-Ellipsoid:
      color: "#105A7F"
      marker: "o"
    RO-BOU:
      color: "#229FBF"
      marker: "o"
    CC-SP:
      color: "#FF9E00" #"#FFC533"
      marker: "o"
    CC-SP-relaxed:
      color: "#229FBF"
      marker: "s"

  options:
    milp: true
    plot: false
    export_path: "mpc_october"  # optional: save all trajectories with a 'label' column
    simulator:
      inp_file: "data/multi_tank/multi_tank.inp"
      min_vol_margin_m: 1.0  # relaxed EPANET min bounds (m); must be < real_min_level for all tanks
