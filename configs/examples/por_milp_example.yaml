# Price of Robustness Comparison Experiment
# Compare multiple optimization methods with parameter sweeps
### FOR WDSA-CCWI ABSTRACT ###

data:
  # data files need to have a datetime index column with time zone aware format
  network_path: "data/price_ostfeld"
  demands_path: "data/price_ostfeld/demands.csv"
  tariffs_path: "data/price_ostfeld/tariffs-hu.csv"

columns:
  prices_col: "tariff"
  demand_cols: ["a", "b", "c"]

training:
  forecast:
    start: "2021-01-01"
    end: "2022-09-30"
  uncertainty:
    start: "2022-08-01"
    end: "2022-09-30"
    source: "forecast_errors"

forecast:
  model: "xgb"
  holiday_country: "HU"
  params:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.05
    n_weeks: 4

experiment:
  type: "por"

  forecast_period:
    start: "2022-10-04"
    end: "2022-10-05"

  methods:
    - group: "RO-Ellipsoid"
      opt_method: "ro"
      params:
        uncertainty_set: "ellipsoid"
      sweep:
        omega: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]

    - group: "RO-BOU"
      opt_method: "ro"
      params:
        uncertainty_set: "bou"
      sweep:
        gamma: [ [4, 2], [4, 4], [4, 6], [4, 8], [4, 10], [4, 12], [4, 14], [4, 16], [4, 18] ]

    # SAA (Stochastic Programming) - sweep alpha (start, end) pairs
    - group: "CCO"
      opt_method: "sp"
      sweep:
        alpha: [[0.80, 0.8], [0.85, 0.85], [0.90, 0.9], [0.95, 0.95], [0.99, 0.99], [0.995, 0.995]]

    - group: "CCO-CVaR"
      opt_method: "sp"
      sweep:
        alpha: [ [ 0.80, 0.8 ], [ 0.85, 0.85 ], [ 0.90, 0.9 ], [ 0.95, 0.95 ], [ 0.99, 0.99 ], [ 0.995, 0.995 ] ]
        lambda_cvar: [1]

  simulation:
    n_samples: 500

  options:
    milp: true
    plot: true
    t: 24

    sampling_method: normal
    omega_to_alpha: subgaussian   # subgaussian or gaussian
    stat_analyze: true
    solver_params:  # gurobi solver parameters
      Threads: 4
      MIPGap: 0.01
